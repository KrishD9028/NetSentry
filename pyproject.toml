[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentry"
version = "0.1.0"
description = "Authorized network security assessment platform"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "smbprotocol>=1.17.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
netsentry = "netsentry.main:main"

[tool.setuptools.packages.find]
include = ["netsentry*"]

[tool.setuptools.package-data]
netsentry = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
